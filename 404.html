  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;

         font-family: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 34rem; text-align: center; }

  p { color: var(--muted); margin: .3em 0; }
  nav { margin-top: 1.6rem; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a { color: var(--copper-ink); background: var(--copper); text-decoration: none; padding: .7em 1.3em; border-radius: 999px; font-weight: 600; }
  a.ghost { background: transparent; color: var(--ink); border: 1px solid rgba(255, 255, 255, .25); }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
